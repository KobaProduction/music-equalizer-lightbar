name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host protocol tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Configure
        run: cmake --preset host-tests

      - name: Build
        run: cmake --build --preset host-tests --verbose

      - name: Test
        run: ctest --preset host-tests

  gcc:
    name: GCC / ${{ matrix.board }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        board:
          - music-light-v3-221101

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNU Arm Embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi ninja-build

      - name: Toolchain version
        run: arm-none-eabi-gcc --version

      - name: Configure
        run: cmake --preset "${{ matrix.board }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.board }}" --verbose

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            build/${{ matrix.board }}/*.elf
            build/${{ matrix.board }}/*.hex
            build/${{ matrix.board }}/*.bin
            build/${{ matrix.board }}/*.map
          if-no-files-found: error
