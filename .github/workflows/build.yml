name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host protocol tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Configure
        run: cmake --preset host-tests

      - name: Build
        run: cmake --build --preset host-tests --verbose

      - name: Test
        run: ctest --preset host-tests

  gcc:
    name: GCC / ${{ matrix.preset }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        preset:
          - music-light-v3-221101
          - music-light-v3-221101-ws2812b-basic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNU Arm Embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi ninja-build

      - name: Toolchain version
        run: arm-none-eabi-gcc --version

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build and verify image
        run: cmake --build --preset "${{ matrix.preset }}" --verbose

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/*.elf
            build/${{ matrix.preset }}/*.hex
            build/${{ matrix.preset }}/*.bin
            build/${{ matrix.preset }}/*.map
            build/${{ matrix.preset }}/*.manifest.json
          if-no-files-found: error
